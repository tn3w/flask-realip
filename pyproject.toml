[project]
name = "flask-realip"
version = "1.1.1"
description = "Flask extension to get real IP addresses behind proxies"
readme = "README.md"
authors = [
    {name = "TN3W", email = "tn3w@protonmail.com"}
]
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
    "Framework :: Flask",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["Flask", "netaddr"]

[project.urls]
Homepage = "https://github.com/tn3w/flask-realip"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flask_realip"]